name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-crates:
    name: Publish crates to crates.io
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify tag matches crate version
        shell: bash
        run: |
          set -euo pipefail
          crate_version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "tauri-specta") | .version')
          test "$GITHUB_REF_NAME" = "v$crate_version"

      - name: Authenticate with crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish macros crate
        run: cargo publish -p tauri-specta-macros --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}

      - name: Publish main crate
        run: cargo publish -p tauri-specta --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
